version: '3.9'
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-recruit}
      POSTGRES_PASSWORD: ${DB_PASS:-secret}
      POSTGRES_DB: ${DB_NAME:-recruitment}
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  # backend:
  #   build: ./backend
